<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Swarup - Python</title>
  <desc id="d">Name banner with a code snippet that types itself out beside a slowly moving signal wave.</desc>
  <defs>
