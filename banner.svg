<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Swarup Kar Chaudhuri — Python Developer</title>
  <desc id="desc">Banner with an animated name, a short description and the technologies Python, FastAPI and GenAI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001F31"/>
      <stop offset=".5" stop-color="#001F31"/>
      <stop offset="1" stop-color="#134045"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="740" y2="0">
      <stop offset="0" stop-color="#D5CB73"/>
      <stop offset="1" stop-color="#B47F56"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SF Mono','Fira Code',Consolas,'Courier New',monospace; }

    .letter {
      font-size: 46px;
      font-weight: 700;
      text-anchor: middle;
      fill: #EFEBD6;
      opacity: 0;
      animation:
        rise .8s cubic-bezier(.2,.8,.2,1) forwards,
        wave 8s ease-in-out infinite;
      animation-delay:
        calc(.3s + var(--i) * .05s),
        calc(2.6s + var(--i) * .08s);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes wave {
      0%   { fill: #EFEBD6; }
      5%   { fill: #D5CB73; }
      12%  { fill: #EFEBD6; }
      100% { fill: #EFEBD6; }
    }

    .underline {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.2s ease-out 1.4s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .fade { opacity: 0; animation: fadeIn .8s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }

    .orbit { transform-origin: 890px 130px; animation: spin 30s linear infinite; }
    .orbit-rev { transform-origin: 890px 130px; animation: spin 46s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .letter, .underline, .fade, .orbit, .orbit-rev { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- Quiet geometric accent on the right -->
    <g fill="none" stroke="#405F4F">
      <circle cx="890" cy="130" r="48" opacity=".55"/>
      <circle cx="890" cy="130" r="88" opacity=".4"/>
      <circle cx="890" cy="130" r="128" opacity=".25"/>
    </g>
    <g class="orbit">
      <circle cx="978" cy="130" r="4" fill="#D5CB73"/>
    </g>
    <g class="orbit-rev">
      <circle cx="890" cy="42" r="3" fill="#B47F56"/>
    </g>

    <!-- Eyebrow -->
    <text class="sans fade" x="60" y="64" fill="#B47F56" font-size="12" font-weight="600" letter-spacing="3.5" style="animation-delay:.1s">
      ENGINEERING GRADUATE  /  PYTHON DEVELOPER
    </text>

    <!-- Name: one element per letter, fixed pitch so the stagger stays aligned -->
    <g class="mono">
      <text class="letter" style="--i:0"  x="77"  y="122">S</text>
      <text class="letter" style="--i:1"  x="111" y="122">W</text>
      <text class="letter" style="--i:2"  x="145" y="122">A</text>
      <text class="letter" style="--i:3"  x="179" y="122">R</text>
      <text class="letter" style="--i:4"  x="213" y="122">U</text>
      <text class="letter" style="--i:5"  x="247" y="122">P</text>

      <text class="letter" style="--i:7"  x="315" y="122">K</text>
      <text class="letter" style="--i:8"  x="349" y="122">A</text>
      <text class="letter" style="--i:9"  x="383" y="122">R</text>

      <text class="letter" style="--i:11" x="451" y="122">C</text>
      <text class="letter" style="--i:12" x="485" y="122">H</text>
      <text class="letter" style="--i:13" x="519" y="122">A</text>
      <text class="letter" style="--i:14" x="553" y="122">U</text>
      <text class="letter" style="--i:15" x="587" y="122">D</text>
      <text class="letter" style="--i:16" x="621" y="122">H</text>
      <text class="letter" style="--i:17" x="655" y="122">U</text>
      <text class="letter" style="--i:18" x="689" y="122">R</text>
      <text class="letter" style="--i:19" x="723" y="122">I</text>
    </g>

    <!-- Underline draws in after the name lands -->
    <path class="underline" d="M60 144 H740" pathLength="1" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

    <!-- Description -->
    <text class="sans fade" x="60" y="178" fill="#9DB5A8" font-size="16" style="animation-delay:1.9s">
      Building backend services and AI applications.
    </text>

    <!-- Tech tags -->
    <g class="mono fade" font-size="11" font-weight="600" style="animation-delay:2.2s">
      <rect x="60"  y="196" width="76" height="26" rx="6" fill="#134045" stroke="#405F4F"/>
      <text x="98"  y="213" fill="#D5CB73" text-anchor="middle">PYTHON</text>

      <rect x="146" y="196" width="80" height="26" rx="6" fill="#134045" stroke="#405F4F"/>
      <text x="186" y="213" fill="#D5CB73" text-anchor="middle">FASTAPI</text>

      <rect x="236" y="196" width="100" height="26" rx="6" fill="#134045" stroke="#405F4F"/>
      <text x="286" y="213" fill="#D5CB73" text-anchor="middle">GENAI / RAG</text>
    </g>

    <!-- Palette strip along the bottom edge -->
    <g>
      <rect x="0"     y="256" width="167" height="4" fill="#001F31"/>
      <rect x="167"   y="256" width="167" height="4" fill="#134045"/>
      <rect x="334"   y="256" width="166" height="4" fill="#405F4F"/>
      <rect x="500"   y="256" width="167" height="4" fill="#D5CB73"/>
      <rect x="667"   y="256" width="167" height="4" fill="#B47F56"/>
      <rect x="834"   y="256" width="166" height="4" fill="#85665E"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="999" height="259" rx="15.5" fill="none" stroke="#405F4F" opacity=".7"/>
</svg>