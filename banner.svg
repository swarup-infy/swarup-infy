    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d" opacity=".55"/></pattern>
    <clipPath id="card"><rect x="560" y="40" width="384" height="160" rx="10"/></clipPath>
    <clipPath id="l1"><rect x="584" y="86" width="0" height="26"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;150;150;0;0" keyTimes="0;0.06;0.18;0.95;0.96;1"/></rect></clipPath>
    <clipPath id="l2"><rect x="584" y="112" width="0" height="26"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;260;260;0;0" keyTimes="0;0.2;0.38;0.95;0.96;1"/></rect></clipPath>
    <clipPath id="l3"><rect x="584" y="146" width="0" height="26"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;240;240;0;0" keyTimes="0;0.4;0.56;0.95;0.96;1"/></rect></clipPath>
  </defs>
  <rect width="1000" height="240" rx="14" fill="#0d1117"/><rect width="1000" height="240" rx="14" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="239" rx="13.5" fill="none" stroke="#30363d"/>
  <g><rect x="56" y="74" width="44" height="4" rx="2" fill="url(#accent)"/><text x="56" y="128" fill="#e6edf3" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Swarup</text><text x="58" y="160" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="18">Engineering student. Building in Python.</text></g>
  <rect x="560" y="40" width="384" height="160" rx="10" fill="#161b22" stroke="#30363d"/><path d="M560 70H944" stroke="#30363d"/><circle cx="580" cy="55" r="4" fill="#484f58"/><circle cx="595" cy="55" r="4" fill="#484f58"/><circle cx="610" cy="55" r="4" fill="#484f58"/><text x="630" y="59" fill="#6e7681" font-family="monospace" font-size="11">main.py</text>
  <g clip-path="url(#card)">
    <g fill="none" stroke-linecap="round"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="5s" repeatCount="indefinite"/><path stroke="#4b8bbe" stroke-width="1.6" opacity=".55" d="M480 186 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></g><g><animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="8s" repeatCount="indefinite"/><path stroke="#ffd43b" stroke-width="1.2" opacity=".25" d="M480 186 q20 8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/></g></g>
    <g font-family="monospace" font-size="15"><g clip-path="url(#l1)"><text x="584" y="104"><tspan fill="#ff7b72">def</tspan><tspan fill="#d2a8ff"> build</tspan><tspan fill="#c9d1d9">(idea):</tspan></text></g><g clip-path="url(#l2)"><text x="584" y="130" xml:space="preserve"><tspan fill="#ff7b72">    return</tspan><tspan fill="#c9d1d9"> ship(test(idea))</tspan></text></g><g clip-path="url(#l3)"><text x="584" y="164"><tspan fill="#c9d1d9">build(</tspan><tspan fill="#a5d6ff">"something useful"</tspan><tspan fill="#c9d1d9">)</tspan></text></g><g><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.56;0.57;0.9;0.94;1"/><rect x="814" y="150" width="8" height="17" fill="#e6edf3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></rect></g></g>
